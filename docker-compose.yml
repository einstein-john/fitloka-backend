services:
  migrate:
    image: node:20-alpine
    container_name: fitloka-migrate
    working_dir: /app
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: sh -c "npm ci && npm run migrate"
    restart: "no"

  seed:
    image: node:20-alpine
    container_name: fitloka-seed
    working_dir: /app
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: sh -c "npm ci && npm run seed"
    restart: "no"

  app:
    image: node:20-alpine
    container_name: fitloka-api
    working_dir: /app
    depends_on:
      seed:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: sh -c "npm ci && npm run build && npm run start"
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  node_modules:
